<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image</title>
<!-- Social preview image for the landing page (1200×630), rendered by make-og.mjs.
     Original artwork only: no third-party logos or player UI. Same palette and fonts as the site. -->
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 700 800; src: url(../../landing-page/fonts/bricolage-grotesque-700-800-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(../../landing-page/fonts/atkinson-hyperlegible-400-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(../../landing-page/fonts/atkinson-hyperlegible-700-latin.woff2) format('woff2'); }
  /* Digits from Bricolage, as on the site (Atkinson's zero is slashed). */
  @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(../../landing-page/fonts/bricolage-grotesque-digits-400-800.woff2) format('woff2'); unicode-range: U+0030-0039; }
  @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(../../landing-page/fonts/bricolage-grotesque-digits-400-800.woff2) format('woff2'); unicode-range: U+0030-0039; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: 'Atkinson Hyperlegible', sans-serif; background: #F5F7FB; color: #1B1E3C; display: flex; align-items: center; gap: 56px; padding: 0 72px; overflow: hidden; }
  .brand { position: absolute; top: 40px; left: 72px; display: flex; align-items: center; gap: 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
  .brand img { width: 42px; height: 42px; }
  .text { flex: 1.1; padding-top: 40px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 74px; line-height: 1.0; font-weight: 800; letter-spacing: -0.025em; }
  p { font-size: 28px; color: #5A6278; margin-top: 28px; line-height: 1.35; }
  .tag { display: inline-block; margin-top: 30px; font-size: 24px; font-weight: 700; background: #FFE14D; padding: 10px 22px; border-radius: 12px; box-shadow: 0 3px 0 #1B1E3C; }
  .card { flex: .9; border: 2px solid rgba(27,30,60,.15); background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(27,30,60,.45); }
  .top { padding: 14px 18px; border-bottom: 2px solid rgba(27,30,60,.1); color: #5A6278; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .top i { width: 11px; height: 11px; border-radius: 50%; background: rgba(27,30,60,.15); display: inline-block; }
  .screen { position: relative; aspect-ratio: 16/9; background-color: #fff;
    background-image: linear-gradient(rgba(61,90,254,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,90,254,.08) 1px, transparent 1px); background-size: 20px 20px; }
  .pill { position: absolute; top: 16px; left: 16px; background: rgba(27,30,60,.92); color: #F5F7FB; font-weight: 700; font-size: 26px; padding: 6px 18px; border-radius: 999px; box-shadow: 0 0 0 4px rgba(255,225,77,.6); }
  .slide { position: absolute; left: 9%; top: 26%; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; }
  svg { position: absolute; left: 12%; right: 12%; bottom: 14%; width: 76%; }
  .bar { background: #1B1E3C; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 18px; }
  .bar span { flex: 1; height: 7px; border-radius: 4px; background: rgba(245,247,251,.2); position: relative; }
  .bar span b { position: absolute; inset: 0 60% 0 0; background: #8C9EFF; border-radius: 4px; }
  .len { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 20px; color: #5A6278; font-size: 20px; }
  .len strong { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; color: #1B1E3C; position: relative; z-index: 0; }
  .len strong::before { content: ''; position: absolute; z-index: -1; inset: 10% -8% 0 -8%; background: #FFE14D; transform: rotate(-1.5deg); border-radius: 4px; }
</style>
</head>
<body>
  <div class="brand"><img src="../../landing-page/img/logo-mark.svg" alt="">SpeedUniversity</div>
  <div class="text">
    <h1>Lectures at your speed. Not your player's.</h1>
    <p>Panopto and Echo360 lectures,<br>faster than 2x.</p>
    <span class="tag">Free Chrome extension</span>
  </div>
  <div class="card">
    <div class="top"><i></i><i></i><i></i><span>Intro to Statistics – Lecture 4</span></div>
    <div class="screen">
      <span class="pill">2.5x</span>
      <span class="slide">The Normal Distribution</span>
      <svg viewBox="0 0 300 90"><path d="M10 85 C 70 85, 95 8, 150 8 S 230 85, 290 85" fill="none" stroke="#3D5AFE" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div class="bar"><span><b></b></span></div>
    <div class="len">This 75-minute lecture takes <strong>30:00</strong></div>
  </div>
</body>
</html>
