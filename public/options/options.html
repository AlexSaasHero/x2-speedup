<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="opt_title">SpeedUp Video Pro — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <div>
        <h1>SpeedUp Video Pro</h1>
        <p class="muted" data-i18n="privacy_line"></p>
      </div>
      <span id="savedHint" class="saved" aria-live="polite"></span>
    </header>

    <section class="card">
      <h2 data-i18n="opt_speed"></h2>
      <div class="grid">
        <label><span data-i18n="opt_speed_step"></span>
          <span class="field"><input type="number" id="speedStep" min="0.01" max="1" step="0.05"><span>x</span></span>
          <small data-i18n="opt_speed_step_hint"></small>
        </label>
        <label><span data-i18n="action_preferred"></span>
          <span class="field"><input type="number" id="favoriteSpeed" min="0.1" max="16" step="0.1"><span>x</span></span>
          <small id="favoriteHint"></small>
        </label>
      </div>
      <label class="check"><input type="checkbox" id="rememberSpeed"> <span data-i18n="opt_remember"></span></label>
      <label class="check"><input type="checkbox" id="applyToAll"> <span data-i18n="opt_apply_all"></span></label>
      <label class="check"><input type="checkbox" id="preservesPitch"> <span data-i18n="opt_pitch"></span></label>
    </section>

    <section class="card">
      <h2 data-i18n="opt_seeking"></h2>
      <div class="grid">
        <label><span data-i18n="opt_seek_by"></span>
          <span class="field"><input type="number" id="seekSeconds" min="1" max="600" step="1"><span>s</span></span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt_overlay"></h2>
      <label class="check"><input type="checkbox" id="hudEnabled"> <span data-i18n="opt_overlay_show"></span></label>
      <div class="grid">
        <label><span data-i18n="opt_overlay_hide"></span>
          <span class="field"><input type="number" id="overlayAutoHideSec" min="0.5" max="10" step="0.5"><span>s</span></span>
        </label>
      </div>
      <p class="muted"><span data-i18n="opt_overlay_drag"></span>
        <button type="button" id="resetPositions" class="link"><span data-i18n="opt_overlay_reset"></span> (<span id="positionsCount">0</span>)</button></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="shortcuts_title"></h2>
        <button type="button" id="resetShortcuts" class="btn" data-i18n="shortcuts_restore"></button>
      </div>
      <p class="muted" data-i18n="opt_shortcuts_hint"></p>
      <div id="shortcutEditor" class="hotkey-remap-list"></div>
    </section>

    <section class="card pro" id="proSection">
      <div class="card-head">
        <h2 data-i18n="opt_pro"></h2>
        <span id="proBadge" class="pill"></span>
      </div>
      <p class="muted" id="proNote"></p>

      <h3 data-i18n="skip_silence"></h3>
      <label class="check"><input type="checkbox" id="ssEnabled"> <span data-i18n="opt_ss_enable"></span></label>
      <div class="grid">
        <label><span data-i18n="opt_ss_threshold"></span>
          <span class="field"><input type="number" id="ssThreshold" min="-70" max="-10" step="1"><span>dB</span></span>
          <small data-i18n="opt_ss_threshold_hint"></small>
        </label>
        <label><span data-i18n="opt_ss_speed"></span>
          <span class="field"><input type="number" id="ssSpeed" min="1.25" max="16" step="0.25"><span>x</span></span>
        </label>
        <label><span data-i18n="opt_ss_before"></span>
          <span class="field"><input type="number" id="ssMinSilence" min="50" max="3000" step="50"><span>ms</span></span>
          <small data-i18n="opt_ss_before_hint"></small>
        </label>
        <label><span data-i18n="opt_ss_after"></span>
          <span class="field"><input type="number" id="ssMinSpeech" min="0" max="3000" step="50"><span>ms</span></span>
          <small data-i18n="opt_ss_after_hint"></small>
        </label>
      </div>
      <p class="muted" data-i18n="opt_ss_note"></p>

      <h3 data-i18n="action_hold"></h3>
      <div class="grid">
        <label><span data-i18n="opt_hold_speed"></span>
          <span class="field"><input type="number" id="holdSpeed" min="0.1" max="16" step="0.25"><span>x</span></span>
          <small data-i18n="opt_hold_hint"></small>
        </label>
      </div>

      <h3 data-i18n="opt_yt_ads"></h3>
      <label class="check"><input type="checkbox" id="youtubeAds"> <span data-i18n="opt_yt_ads_enable"></span></label>

      <h3 data-i18n="rules_title"></h3>
      <p class="muted" data-i18n="opt_rules_hint"></p>
      <table class="rules">
        <thead><tr><th data-i18n="opt_rules_type"></th><th data-i18n="opt_rules_pattern"></th><th data-i18n="opt_rules_speed"></th><th></th></tr></thead>
        <tbody id="rulesBody"></tbody>
        <tfoot>
          <tr>
            <td><select id="newRuleType">
              <option value="channel" data-i18n="rule_type_channel"></option>
              <option value="url" data-i18n="rule_type_url"></option>
              <option value="domain" data-i18n="rule_type_domain" selected></option>
            </select></td>
            <td><input type="text" id="newRulePattern" placeholder="youtube.com"></td>
            <td><input type="number" id="newRuleSpeed" min="0.1" max="16" step="0.1" value="1.5"></td>
            <td><button type="button" class="btn" id="addRule" data-i18n="opt_add"></button></td>
          </tr>
        </tfoot>
      </table>
    </section>

    <section class="card">
      <h2 data-i18n="opt_blacklist"></h2>
      <p class="muted" data-i18n="opt_blacklist_hint"></p>
      <textarea id="shortcutBlacklist" rows="5" spellcheck="false" placeholder="docs.google.com"></textarea>
    </section>

    <section class="card">
      <h2 data-i18n="opt_backup"></h2>
      <label class="check"><input type="checkbox" id="syncEnabled"> <span data-i18n="opt_sync_enable"></span></label>
      <p class="muted"><span data-i18n="opt_sync_hint"></span> <span id="syncStatus"></span></p>
      <div class="actions">
        <button type="button" class="btn" id="exportBtn" data-i18n="opt_export"></button>
        <label class="btn file"><span data-i18n="opt_import_file"></span><input type="file" id="importFile" accept="application/json,.json" hidden></label>
      </div>
      <p class="muted" data-i18n="opt_import_paste_hint"></p>
      <textarea id="importText" rows="4" spellcheck="false" placeholder='{ "format": "speedup-video-pro-settings", … }'></textarea>
      <div class="actions">
        <button type="button" class="btn" id="importBtn" data-i18n="opt_import"></button>
        <span id="importMsg" class="msg" aria-live="polite"></span>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
