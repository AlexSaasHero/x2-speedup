<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedUp Video Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 19 22 12 13 5 13 19"></polygon>
            <polygon points="2 19 11 12 2 5 2 19"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SpeedUP <span class="accent-text">Video Pro</span></h1>
        </div>
      </div>
      <div class="header-right">
        <!-- Interactive License / Trial Tier Badge -->
        <button id="licenseTierBadge" class="tier-badge tier-free" data-i18n-title="tier_badge_title">
          <span class="tier-dot"></span>
          <span id="tierBadgeText"></span>
        </button>
        <!-- Video Detection Status Badge -->
        <div id="statusBadge" class="status-badge status-offline">
          <span class="status-dot"></span>
          <span id="statusText" data-i18n="status_searching"></span>
        </div>
      </div>
    </header>

    <!-- COMPACT PRO UPGRADE & LICENSE MODAL / CASSETTO -->
    <section id="proUpgradeModal" class="pro-upgrade-modal" style="display: none;" role="dialog" aria-modal="true">
      <div class="pro-modal-card">
        <button id="closeUpgradeModalBtn" class="pro-modal-close" data-i18n-title="close" data-i18n-aria-label="close">×</button>
        <div class="pro-modal-badge">
          <span>⚡ SPEEDUP PRO</span>
        </div>
        <p id="proModalTitle" class="pro-modal-title"></p>
        <button id="ctaBuyBtn" class="cta-buy-btn" data-i18n="cta_start_trial"></button>

        <div class="divider">
          <span data-i18n="license_divider"></span>
        </div>

        <div class="key-form">
          <input type="text" id="input-license-key" data-i18n-placeholder="license_placeholder" autocomplete="off" spellcheck="false">
          <button id="activateBtn" class="activate-btn" data-i18n="license_activate"></button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    </section>

    <!-- MAIN SUITE SECTION (Speed Hub, Shortcuts, Precision - Active Immediately) -->
    <div id="speedControls">
      <!-- 3-Tab Navigation Bar -->
      <nav class="tab-nav" role="tablist" data-i18n-aria-label="tabs_label">
        <button class="tab-btn active" data-tab="speed" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 14l4-4"></path>
            <path d="M3.34 19a10 10 0 1 1 17.32 0"></path>
          </svg>
          <span data-i18n="tab_speed"></span>
        </button>

        <button class="tab-btn" data-tab="shortcuts" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <line x1="6" y1="8" x2="6.01" y2="8"></line>
            <line x1="10" y1="8" x2="10.01" y2="8"></line>
            <line x1="14" y1="8" x2="14.01" y2="8"></line>
            <line x1="18" y1="8" x2="18.01" y2="8"></line>
            <line x1="8" y1="12" x2="8.01" y2="12"></line>
            <line x1="12" y1="12" x2="12.01" y2="12"></line>
            <line x1="16" y1="12" x2="16.01" y2="12"></line>
            <line x1="7" y1="16" x2="17" y2="16"></line>
          </svg>
          <span data-i18n="tab_shortcuts"></span>
        </button>

        <button class="tab-btn" data-tab="precision" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="22" y1="12" x2="18" y2="12"></line>
            <line x1="6" y1="12" x2="2" y2="12"></line>
            <line x1="12" y1="6" x2="12" y2="2"></line>
            <line x1="12" y1="22" x2="12" y2="18"></line>
          </svg>
          <span data-i18n="tab_precision"></span>
        </button>

        <button class="tab-btn" data-tab="pro" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span data-i18n="tab_smart"></span>
        </button>
      </nav>

      <!-- ==========================================
           TAB 1: SPEED HUB
           ========================================== -->
      <div id="tab-speed" class="tab-pane active" style="display: block;">
        <main class="main-content">
          <section class="speed-display-card">
            <div class="card-glow"></div>
            <div class="speed-header">
              <span class="label"><span data-i18n="speed_hub"></span> <span id="tierRangeHint" class="tier-hint"></span></span>
              <button id="resetBtn" class="reset-btn" data-i18n-title="reset_title">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
                <span data-i18n="reset_1x"></span>
              </button>
            </div>

            <!-- Real-time Numeric Speed Badge -->
            <div class="speed-display" id="speedVal">1.0x</div>

            <!-- Continuous Slider (0.1x to 16.0x) -->
            <div class="slider-container">
              <input type="range" id="speedSlider" min="0.1" max="16.0" step="0.05" value="1.0">
              <div class="slider-ticks">
                <span>0.25x</span>
                <span>1.0x</span>
                <span>2.0x</span>
                <span>4.0x</span>
                <span>16x ⚡</span>
              </div>
            </div>

            <!-- Fine Adjustments Bar -->
            <div class="fine-adjust">
              <button class="step-btn" data-step-mult="-2.5">-0.25x</button>
              <button class="step-btn" data-step-mult="-1">-0.10x</button>
              <div class="custom-input-wrapper">
                <input type="number" id="customSpeedInput" min="0.1" max="16.0" step="0.05" value="1.00" data-i18n-aria-label="custom_speed">
                <span class="input-unit">x</span>
              </div>
              <button class="step-btn" data-step-mult="1">+0.10x</button>
              <button class="step-btn" data-step-mult="2.5">+0.25x</button>
            </div>
          </section>

          <!-- One-time review request (after 30 min saved) -->
          <section class="review-banner" id="reviewBanner" hidden>
            <span id="reviewText"></span>
            <div class="review-actions">
              <button type="button" id="reviewRate" class="review-rate" data-i18n="review_rate"></button>
              <button type="button" id="reviewLater" class="review-later" data-i18n="review_later"></button>
            </div>
          </section>

          <!-- Time saved (headline for everyone, breakdown with Pro) -->
          <section class="stats-strip" id="statsStrip">
            <div class="stats-headline">⏱ <span data-i18n="stats_week"></span> <strong id="statsWeek">0s</strong></div>
            <div class="stats-details" id="statsDetails">
              <span><span data-i18n="stats_today"></span> <strong id="statsToday">0s</strong></span>
              <span><span data-i18n="stats_page"></span> <strong id="statsSession">0s</strong></span>
              <span><span data-i18n="stats_total"></span> <strong id="statsTotal">0s</strong></span>
            </div>
            <button type="button" class="stats-locked pro-lock-btn" id="statsLocked" data-i18n="stats_locked"></button>
          </section>

          <!-- Quick Presets (all within the free range; >4x via slider/input with Pro) -->
          <section class="presets-section">
            <span class="section-title" data-i18n="presets"></span>
            <div class="presets presets-six">
              <button class="preset-btn" data-speed="0.5">0.5x</button>
              <button class="preset-btn active" data-speed="1.0">1.0x</button>
              <button class="preset-btn" data-speed="1.5">1.5x</button>
              <button class="preset-btn" data-speed="2.0">2.0x</button>
              <button class="preset-btn" data-speed="3.0">3.0x</button>
              <button class="preset-btn" data-speed="4.0">4.0x</button>
            </div>
          </section>
        </main>
      </div>

      <!-- ==========================================
           TAB 2: CUSTOM HOTKEYS (RIMAPPATURA TOTALE)
           ========================================== -->
      <div id="tab-shortcuts" class="tab-pane" style="display: none;">
        <main class="main-content">
          <section class="shortcuts-card">
            <div class="shortcuts-header">
              <div>
                <span class="label" data-i18n="shortcuts_title"></span>
                <p class="shortcuts-sub" data-i18n="shortcuts_sub"></p>
              </div>
              <button id="resetHotkeysBtn" class="reset-btn" data-i18n-title="shortcuts_restore">
                <span data-i18n="default"></span>
              </button>
            </div>

            <div id="shortcutEditor" class="hotkey-remap-list"></div>

            <label class="site-toggle-row">
              <input type="checkbox" id="siteShortcutsToggle">
              <span><span data-i18n="shortcuts_disable_on"></span> <strong id="siteShortcutsHost">—</strong></span>
            </label>

            <!-- Favorite Speed Target Setting -->
            <div class="fav-speed-row">
              <div class="hotkey-meta">
                <span class="hotkey-name" data-i18n="preferred_value"></span>
                <span class="hotkey-desc" data-i18n="preferred_value_desc"></span>
              </div>
              <div class="custom-input-wrapper fav-input-wrap">
                <input type="number" id="favoriteSpeedInput" min="0.1" max="16.0" step="0.1" value="2.0" data-i18n-aria-label="preferred_value">
                <span class="input-unit">x</span>
              </div>
            </div>
          </section>

          <div class="hud-feedback-banner">
            <span class="hud-banner-icon">⚡</span>
            <span data-i18n="overlay_hint"></span>
          </div>
          <button id="openOptionsBtn" class="options-link-btn" type="button" data-i18n="all_settings"></button>
        </main>
      </div>

      <!-- ==========================================
           TAB 3: PRECISION & CHECKPOINTS (PRO)
           ========================================== -->
      <div id="tab-precision" class="tab-pane" style="display: none;">
        <main class="main-content">
          <!-- Frame-by-Frame Scrubbing & Quick Jumps -->
          <section class="precision-card">
            <div class="precision-header">
              <span class="label"><span data-i18n="frame_seek"></span> <span class="pro-pill-tag" data-i18n="pro_frames"></span></span>
              <span id="precisionTimeBadge" class="time-pill">00:00</span>
            </div>

            <!-- Frame-by-Frame Buttons (-0.033s / +0.033s) -->
            <div class="scrub-grid">
              <button id="prevFrameBtn" class="scrub-btn frame-btn" data-i18n-title="prev_frame_title">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line x1="5" y1="19" x2="5" y2="5"></line>
                </svg>
                <span data-i18n="prev_frame"></span>
              </button>

              <button id="nextFrameBtn" class="scrub-btn frame-btn" data-i18n-title="next_frame_title">
                <span data-i18n="next_frame"></span>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
              </button>
            </div>

            <!-- Quick Seek (-5s / Play-Pause / +5s) -->
            <div class="jump-grid">
              <button id="seekBack5Btn" class="scrub-btn">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path>
                </svg>
                <span id="seekBackLabel">-10s</span>
              </button>

              <button id="togglePlayBtn" class="scrub-btn play-Ctrl-btn" data-i18n-title="play_pause">
                <span id="playText" data-i18n="pause"></span>
              </button>

              <button id="seekFwd5Btn" class="scrub-btn">
                <span id="seekFwdLabel">+10s</span>
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M13 5l5 5-5 5M6 5l5 5-5 5"></path>
                </svg>
              </button>
            </div>
          </section>

          <!-- A-B repeat -->
          <section class="precision-card ab-card">
            <div class="precision-header">
              <span class="label"><span data-i18n="ab_repeat"></span> <span class="pro-pill-tag">PRO</span></span>
              <span id="abState" class="time-pill" data-i18n="ab_off"></span>
            </div>
            <div class="jump-grid">
              <button id="abSetA" class="scrub-btn" type="button" data-i18n="ab_set_a"></button>
              <button id="abSetB" class="scrub-btn" type="button" data-i18n="ab_set_b"></button>
              <button id="abClear" class="scrub-btn" type="button" data-i18n="ab_clear"></button>
            </div>
          </section>

          <!-- Video Checkpoints / Bookmarks -->
          <section class="checkpoints-card">
            <div class="checkpoints-header">
              <span class="label"><span data-i18n="bookmarks"></span> <span class="pro-pill-tag">PRO</span></span>
              <span id="checkpointCountBadge" class="cp-count"></span>
            </div>

            <div class="checkpoint-add-bar">
              <input type="text" id="checkpointLabelInput" data-i18n-placeholder="bookmark_note" maxlength="40" autocomplete="off">
              <button id="addCheckpointBtn" class="add-cp-btn" data-i18n-title="bookmark_add_title">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span data-i18n="bookmark_add"></span>
              </button>
            </div>

            <div id="checkpointsList" class="checkpoints-list">
              <div class="cp-empty" data-i18n="bookmarks_empty"></div>
            </div>
          </section>
        </main>
      </div>

      <!-- ==========================================
           TAB 4: SMART (PRO FEATURES)
           ========================================== -->
      <div id="tab-pro" class="tab-pane" style="display: none;">
        <main class="main-content">
          <section class="precision-card pro-feature" data-feature="skipSilence">
            <label class="feature-row">
              <span class="hotkey-meta">
                <span class="hotkey-name"><span data-i18n="skip_silence"></span> <span class="pro-pill-tag">PRO</span></span>
                <span class="hotkey-desc" id="skipSilenceStatus" data-i18n="skip_silence_desc"></span>
              </span>
              <input type="checkbox" id="skipSilenceToggle" class="switch">
            </label>
          </section>

          <section class="precision-card pro-feature" data-feature="rules">
            <div class="hotkey-meta">
              <span class="hotkey-name"><span data-i18n="rules_title"></span> <span class="pro-pill-tag">PRO</span></span>
              <span class="hotkey-desc" id="activeRuleText" data-i18n="rules_none"></span>
            </div>
            <div class="rule-save">
              <span class="hotkey-desc"><span data-i18n="rules_always_at"></span> <strong id="ruleSpeedLabel">1.0x</strong></span>
              <div class="jump-grid rule-grid">
                <button id="ruleChannelBtn" class="scrub-btn" type="button" disabled data-i18n="rule_channel"></button>
                <button id="ruleUrlBtn" class="scrub-btn" type="button" data-i18n="rule_video"></button>
                <button id="ruleDomainBtn" class="scrub-btn" type="button" data-i18n="rule_site"></button>
              </div>
              <button id="removeRuleBtn" class="logout-link" type="button" style="display:none" data-i18n="rule_remove"></button>
            </div>
          </section>

          <section class="precision-card pro-feature" data-feature="youtubeAds">
            <label class="feature-row">
              <span class="hotkey-meta">
                <span class="hotkey-name"><span data-i18n="yt_ads"></span> <span class="pro-pill-tag">PRO</span></span>
                <span class="hotkey-desc" data-i18n="yt_ads_desc"></span>
              </span>
              <input type="checkbox" id="youtubeAdsToggle" class="switch">
            </label>
          </section>

          <section class="precision-card pro-feature" data-feature="holdToSpeed">
            <div class="hotkey-meta">
              <span class="hotkey-name"><span data-i18n="action_hold"></span> <span class="pro-pill-tag">PRO</span></span>
              <span class="hotkey-desc" id="holdHint"></span>
            </div>
          </section>

          <button id="openOptionsBtn2" class="options-link-btn" type="button" data-i18n="rules_advanced"></button>
        </main>
      </div>

      <!-- Sticky / Bottom Lifetime License CTA Section (Trial & Free only) -->
      <section id="footerCtaSection" class="footer-cta-section">
        <button id="btn-upgrade-pro" class="main-cta-btn" type="button" data-i18n-title="cta_start_trial">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span id="footerCtaBtnText" data-i18n="cta_start_trial"></span>
        </button>
        <p class="cta-microcopy" data-i18n="cta_microcopy"></p>
      </section>

      <!-- Footer with License Status & Disattiva action -->
      <footer class="app-footer">
        <span id="footerLicenseStatus" class="footer-note"></span>
        <div class="footer-actions">
          <button id="openUpgradeBtn" class="upgrade-footer-btn" data-i18n="activate_pro"></button>
          <button id="logoutKeyBtn" class="logout-link" data-i18n-title="license_remove_title" style="display: none;" data-i18n="license_remove"></button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
