<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- LectureSpeed favicon: ink mark, switches to the yellow mark on dark browser UI. -->
  <style>
    .bg { fill: #1B1E3C } .fg { stroke: #FFE14D } .ln { stroke: #F5F7FB; stroke-opacity: .45 }
    @media (prefers-color-scheme: dark) { .bg { fill: #FFE14D } .fg { stroke: #1B1E3C } .ln { stroke: #1B1E3C; stroke-opacity: .4 } }
  </style>
  <rect class="bg" width="64" height="64" rx="15"/>
  <line class="ln" x1="32" y1="11" x2="32" y2="53" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <polyline class="fg" points="13,19 24,32 13,45" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline class="fg" points="40,19 51,32 40,45" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
