<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="LectureSpeed">
  <!-- LectureSpeed mark drawn for 16 px: no dashed line (it turns to mush), thicker chevrons. -->
  <rect width="16" height="16" rx="3.5" fill="#1B1E3C"/>
  <polyline points="3.5,4.5 6.5,8 3.5,11.5" fill="none" stroke="#FFE14D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="9.5,4.5 12.5,8 9.5,11.5" fill="none" stroke="#FFE14D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
