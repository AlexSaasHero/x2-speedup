name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image matching @playwright/test 1.49.1: Node, Chromium and all system
    # dependencies preinstalled (no fragile apt step at run time).
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (with coverage)
        run: npm run test:coverage
      - name: Build Chrome/Edge and Firefox
        run: |
          npm run build
          npm run build -- --target=firefox
      - name: E2E (extension loaded in Chromium)
        # Runs the Italian-UI test too (skipped on macOS).
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            dist/
            dist-firefox/
          retention-days: 14
